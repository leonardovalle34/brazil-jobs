# Cloud Workflows definition: caged_monthly
#
# Triggered monthly by Cloud Scheduler (cron: "0 6 15 * *" — 15th of each
# month, 6am, giving margin for the government's release delay — see
# docs/DATA_SPEC.md §5).
#
# This workflow is intentionally thin: it just orchestrates three HTTP
# calls to a Cloud Run service that holds the actual Python logic in
# app.py / ingestion/. Cloud Workflows itself has no Python runtime —
# the orchestration/execution split is deliberate, matching the pattern
# already used in production at the owner's day job.
#
# CLOUD_RUN_JOB_URL: https://jobs-in-brazil-pipeline-430812933236.us-central1.run.app
#
# Manual override: execute with input {"period": "202508"} to force a
# specific period (useful for testing or backfilling), instead of
# always computing "last month" automatically.

main:
  params: [input]
  steps:
    - init:
        assign:
          - service_url: "https://jobs-in-brazil-pipeline-430812933236.us-central1.run.app"

    - check_input_period:
        switch:
          - condition: ${"period" in input}
            assign:
              - reference_period: ${input.period}
            next: download_step
        next: compute_reference_period

    - compute_reference_period:
        assign:
          - now_iso: ${time.format(sys.now())}
          - current_month_prefix: ${text.substring(now_iso, 0, 7)}
          - first_of_month_iso: ${current_month_prefix + "-01T00:00:00Z"}
          - first_of_month_seconds: ${time.parse(first_of_month_iso)}
          - prev_month_seconds: ${first_of_month_seconds - 86400}
          - prev_month_iso: ${time.format(prev_month_seconds)}
          - prev_month_prefix: ${text.substring(prev_month_iso, 0, 7)}
          - reference_period: ${text.replace_all(prev_month_prefix, "-", "")}
        next: download_step

    - download_step:
        call: http.post
        args:
          url: "${service_url}/download"
          auth:
            type: OIDC
          body:
            period: ${reference_period}
        result: download_result

    - check_download:
        switch:
          - condition: ${download_result.body.status != "ok"}
            raise: '${"Download step failed for period " + reference_period}'
        next: transform_step

    - transform_step:
        call: http.post
        args:
          url: "${service_url}/transform"
          auth:
            type: OIDC
          body:
            period: ${reference_period}
            raw_path: ${download_result.body.raw_path}
        result: transform_result

    - check_transform:
        switch:
          - condition: ${transform_result.body.status != "ok"}
            raise: '${"Transform step failed for period " + reference_period}'
        next: load_step

    - load_step:
        call: http.post
        args:
          url: "${service_url}/load"
          auth:
            type: OIDC
          body:
            period: ${reference_period}
            fact_path: ${transform_result.body.fact_path}
        result: load_result

    - check_load:
        switch:
          - condition: ${load_result.body.status != "ok"}
            raise: '${"Load step failed for period " + reference_period}'
        next: done

    - done:
        return:
          period: ${reference_period}
          rows_loaded: ${load_result.body.rows_loaded}
          status: "ok"